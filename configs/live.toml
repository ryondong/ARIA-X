# Live run against one real host, with the egress pool.
#
#   ./run-auth.sh run -c configs/live.toml --goal "..."     (needs ARIAX_PROXIES exported)
#
# 1.3 rps, one navigation, browser only when the wall demands it.

name = "Live host (egress pool)"
data_dir = "data"
runs_dir = "runs"
log_level = "INFO"

[scope]
authorized = true
targets = ["www.zoominfo.com"]
deny = []
allow_private = true
allow_loopback = true
max_rps = 1.3
ports = [443]

[llm]
provider = "openai"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key = ""
temperature = 0.2
max_tokens = 4096
max_retries = 2
tool_mode = "auto"
json_mode = false

[budget]
max_seconds = 600
max_llm_calls = 60
max_tokens = 500000
max_tool_calls = 60
max_steps_per_task = 12
max_intents_per_reason = 1
max_concurrency = 1
max_total_intents = 4

[sandbox]
backend = "local"
image = "kalilinux/kali-rolling"
network = "none"
timeout = 60
max_output = 20000

[safety]
approval = "auto"
block_destructive = true
redact_secrets = true
allow_public_targets = true
max_command_seconds = 60

[server]
host = "127.0.0.1"
port = 8787

[engine]
language = "en"
bootstrap = true
max_idle_rounds = 2
require_finding_for_completion = true
